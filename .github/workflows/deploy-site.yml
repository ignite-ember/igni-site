# Upload a built dist/ (artifact "dist" of the calling run) to one
# environment's bucket, invalidate its CDN hosts, and smoke-check it.
# Called by ci.yml (stage, on push to main) and deploy.yml (production,
# on a release-v* tag). The upload order and Cache-Control are in
# scripts/deploy-site.sh.
name: Deploy site (reusable)

on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      bucket: { type: string, required: true }
      hosts: { type: string, required: true, description: 'Comma-separated hosts to invalidate' }
      site_url: { type: string, required: true }
      service_account: { type: string, required: true }

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ember-prod-491411
  GCP_WIF_PROVIDER: projects/429289688144/locations/global/workloadIdentityPools/github/providers/igni-site
  URL_MAP: igni-public-urlmap

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.site_url }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            src/App.tsx
            src/docs/docsManifest.ts
            # The SDK pages' index, which scripts/site-routes.mjs reads to
            # know every /docs/sdk route the site answers. Without it the
            # deploy cannot list the routes and the job fails.
            src/docs/sdk/index.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ inputs.service_account }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Upload and invalidate
        env:
          BUCKET: ${{ inputs.bucket }}
          HOSTS: ${{ inputs.hosts }}
        run: scripts/deploy-site.sh "$BUCKET" "$URL_MAP" "$HOSTS"

      - name: Smoke check
        env:
          SITE_URL: ${{ inputs.site_url }}
        run: scripts/smoke-site.sh "$SITE_URL" dist
