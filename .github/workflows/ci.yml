# Every push to main and every pull request: lint, build, unit and
# Playwright tests. A push to main then deploys the build to stage
# (stage.ignite-ember.sh) — once the repository variable DEPLOY_STAGE is
# "true", which is set after scripts/setup-deploy-gcp.sh has run.
# Production is deploy.yml, on a release-v* tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces the old run; on main every
  # run finishes, so a stage deploy is never cut off halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright (chromium)
        run: npx playwright test --project=chromium

      - name: Keep the Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

      - name: Keep the build for the stage deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 14
          if-no-files-found: error

  stage:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_STAGE == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
    with:
      environment: stage
      bucket: igni-public-site-stage
      hosts: stage.ignite-ember.sh
      site_url: https://stage.ignite-ember.sh
      service_account: igni-site-deploy-stage@ember-prod-491411.iam.gserviceaccount.com
