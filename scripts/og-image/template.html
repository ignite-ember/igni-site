<!doctype html>
<!--
  The link-preview image, public/og-image.png (1200×630).
  Render with `npm run og-image`. Every claim here is on the landing page
  (src/pages/LandingPage.tsx): keep it that way, and re-render when the
  hero changes. Text is sized to stay readable at half size (600×315),
  which is how most chat apps show it.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    background:
      radial-gradient(ellipse 700px 500px at 100% 100%, rgba(242, 106, 27, 0.16), transparent 70%),
      radial-gradient(ellipse 600px 300px at 0% 0%, rgba(194, 65, 12, 0.08), transparent 70%),
      #0d1117;
    color: #f0f6fc;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 40px; font-weight: 700; letter-spacing: -0.5px; }
  .brand svg { width: 48px; height: 48px; }
  h1 {
    margin-top: 44px;
    font-size: 84px;
    line-height: 1.02;
    font-weight: 800;
    letter-spacing: -2.5px;
  }
  h1 .grad {
    display: block;
    background: linear-gradient(135deg, #F26A1B, #C2410C);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    padding-bottom: 6px;
  }
  .sub {
    margin-top: 26px;
    font-size: 32px;
    line-height: 1.3;
    color: #b7c0cb;
    max-width: 1000px;
  }
  .row { margin-top: auto; display: flex; gap: 16px; }
  .chip {
    font-size: 27px;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: 14px;
    border: 2px solid rgba(240, 246, 252, 0.14);
    background: rgba(240, 246, 252, 0.04);
    color: #e6edf3;
  }
  .chip--accent { border: 2px dashed rgba(242, 106, 27, 0.6); background: rgba(242, 106, 27, 0.1); color: #fdba74; }
  .url { position: absolute; top: 72px; right: 72px; font-size: 26px; color: #8b949e; font-weight: 500; }
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#EE6138"/><path fill="#fff" fill-rule="evenodd" transform="translate(32 33) scale(.8) translate(-32 -32)" d="M34.2 5.1C35.6 4.6 36.3 6 36.6 7.6C38.4 15.2 38.9 22.4 36.9 29.4C40.2 27.9 42.2 25.1 42.9 21.2C43.2 19.9 44.5 19.7 45.3 20.8C49.2 26.3 51.6 32.2 51.2 39.8C50.8 50.9 42.3 58.9 31.8 58.7C21.4 58.5 13.2 50.4 13.3 40.1C13.4 33.5 16.3 28.6 20.6 23.7C25.8 17.8 31.4 12.3 33.1 6.4C33.3 5.8 33.6 5.3 34.2 5.1Z M32.9 33.9C30.1 37.6 25.6 40.5 25.6 45.9C25.7 50.2 28.9 52.9 32.5 52.8C36.4 52.6 39.3 49.8 38.9 45.6C38.5 41.1 35.6 37.9 32.9 33.9Z"/></svg>
    igni
  </div>
  <div class="url">igni.sh</div>
  <h1>AI agents that run <span class="grad">inside your network</span></h1>
  <p class="sub">Air-gapped, or on dedicated GPUs you rent. Ignite&nbsp;Ember hosts nothing and has no route in.</p>
  <div class="row">
    <span class="chip chip--accent">Free Apache-2.0 base</span>
    <span class="chip">Modules from €8k a year</span>
    <span class="chip">Nothing metered</span>
  </div>
</body>
</html>
