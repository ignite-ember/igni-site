<!doctype html>
<!--
  The link-preview image, public/og-image.png (1200×630).
  Render with `npm run og-image`. Every claim here is on the landing page
  (src/pages/LandingPage.tsx): keep it that way, and re-render when the
  hero changes. Text is sized to stay readable at half size (600×315),
  which is how most chat apps show it.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    background:
      radial-gradient(ellipse 700px 500px at 100% 100%, rgba(249, 115, 22, 0.16), transparent 70%),
      radial-gradient(ellipse 600px 300px at 0% 0%, rgba(220, 38, 38, 0.08), transparent 70%),
      #0d1117;
    color: #f0f6fc;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 40px; font-weight: 700; letter-spacing: -0.5px; }
  .brand svg { width: 48px; height: 48px; }
  h1 {
    margin-top: 44px;
    font-size: 84px;
    line-height: 1.02;
    font-weight: 800;
    letter-spacing: -2.5px;
  }
  h1 .grad {
    display: block;
    background: linear-gradient(135deg, #F97316, #DC2626);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    padding-bottom: 6px;
  }
  .sub {
    margin-top: 26px;
    font-size: 32px;
    line-height: 1.3;
    color: #b7c0cb;
    max-width: 1000px;
  }
  .row { margin-top: auto; display: flex; gap: 16px; }
  .chip {
    font-size: 27px;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: 14px;
    border: 2px solid rgba(240, 246, 252, 0.14);
    background: rgba(240, 246, 252, 0.04);
    color: #e6edf3;
  }
  .chip--accent { border: 2px dashed rgba(249, 115, 22, 0.6); background: rgba(249, 115, 22, 0.1); color: #fdba74; }
  .url { position: absolute; top: 72px; right: 72px; font-size: 26px; color: #8b949e; font-weight: 500; }
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M7.998 14.5c-3.312 0-6-2.246-6-5.014 0-3.047 2.262-5.674 3.625-7.018.27-.266.717-.058.717.318 0 1.335.877 2.562 1.753 2.562.645 0 .972-.379 1.096-.65.258-.564.2-1.363.027-2.043-.098-.387.3-.726.65-.498C10.87 3.534 14 6.186 14 9.486c0 2.768-2.688 5.014-6.002 5.014z" fill="#f85149"/>
      <path d="M8.7 13.563c-1.822 0-3.3-1.235-3.3-2.758 0-1.677 1.244-3.122 1.994-3.862.149-.146.394-.032.394.175 0 .734.482 1.41.964 1.41.355 0 .534-.209.603-.358.142-.31.11-.75.015-1.124-.054-.213.165-.4.357-.274 1.266.894 2.987 2.354 2.987 4.033 0 1.523-1.479 2.758-3.014 2.758z" fill="#f0883e"/>
    </svg>
    igni
  </div>
  <div class="url">ignite-ember.sh</div>
  <h1>AI agents that run <span class="grad">inside your network</span></h1>
  <p class="sub">Air-gapped, or on dedicated GPUs you rent. Ignite&nbsp;Ember hosts nothing and has no route in.</p>
  <div class="row">
    <span class="chip chip--accent">Free Apache-2.0 base</span>
    <span class="chip">Modules from €8k a year</span>
    <span class="chip">Nothing metered</span>
  </div>
</body>
</html>
